<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyntraPass - Volunteer Participants</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f7f9fc; color: #0d162a; padding-bottom: 80px; }

        .top-bar {
            background: white; padding: 16px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100;
        }
        .btn-menu {
            background: white; border: 1px solid #e2e8f0; border-radius: 12px;
            width: 44px; height: 44px; font-size: 20px; cursor: pointer; color: #0d162a;
        }

        .container { padding: 24px 16px; max-width: 480px; margin: 0 auto; }
        .page-title { font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
        .page-subtitle { font-size: 14px; color: #475569; margin-bottom: 24px; line-height: 1.5; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
        }

        .stat-card {
            background: white; border-radius: 16px; padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        
        .stat-icon {
            width: 48px; height: 48px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-size: 24px; margin-bottom: 12px;
        }

        .stat-val { font-size: 32px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
        .stat-label { font-size: 13px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }

        .c-attended { background: #e0e7ff; color: #5b54e3; }
        .c-approved { background: #dcfce7; color: #16a34a; }
        .c-registered { background: #e0f2fe; color: #0284c7; }
        .c-rejected { background: #fee2e2; color: #dc2626; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-top: 1px solid #e2e8f0;
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; color: #64748b; font-size: 11px; font-weight: 600; gap: 4px;
        }
        .nav-item.active { color: #5b54e3; }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

<div class="top-bar">
    <button class="btn-menu" id="menuBtn" onclick="window.history.back()">←</button>
    <button class="btn-logout" onclick="volunteerLogout()" style="background: none; border: none; color: #ef4444; font-weight: 600; cursor: pointer; font-size: 14px; padding: 8px;">Logout 🚪</button>
</div>

<div class="container">
    <h1 class="page-title">Event Participants</h1>
    <p class="page-subtitle">Live registration and attendance statistics for this event.</p>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon c-attended">🔲</div>
            <div class="stat-val" id="val-attended">-</div>
            <div class="stat-label">Scanned</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon c-approved">✅</div>
            <div class="stat-val" id="val-approved">-</div>
            <div class="stat-label">Approved</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon c-registered">📋</div>
            <div class="stat-val" id="val-registered">-</div>
            <div class="stat-label">Registered</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon c-rejected">❌</div>
            <div class="stat-val" id="val-rejected">-</div>
            <div class="stat-label">Rejected</div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <a href="volunteer_dashboard.html" class="nav-item"><span class="nav-icon">⊞</span><span>Dashboard</span></a>
    <a href="volunteer_scan.html" class="nav-item"><span class="nav-icon">🔲</span><span>Scan</span></a>
    <a href="volunteer_participants.html" class="nav-item active"><span class="nav-icon">👥</span><span>Participants</span></a>
</div>

<script>
    const SUPABASE_URL  = 'https://qokgtrabcxtxlympbkyb.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFva2d0cmFiY3h0eGx5bXBia3liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczODMyMDYsImV4cCI6MjEwMjk1OTIwNn0.hbs5MZ4FiqUoZxDTrGqtMPOjRbbKUupgZOcoeLZa3ME';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    async function init() {
        const vCode = localStorage.getItem('volunteer_code');
        const vEventId = localStorage.getItem('volunteer_event_id');
        
        if (!vCode || !vEventId) {
            window.location.href = 'index.html';
            return;
        }

        try {
            const { data, error } = await sb.rpc('volunteer_get_event_stats', {
                v_code: vCode,
                e_id: vEventId
            });

            if (error) throw error;

            document.getElementById('val-attended').textContent = data.attended || 0;
            document.getElementById('val-approved').textContent = data.approved || 0;
            document.getElementById('val-registered').textContent = data.total_registered || 0;
            document.getElementById('val-rejected').textContent = data.rejected || 0;

        } catch (err) {
            console.error("Error fetching stats:", err);
            alert("Could not load stats. " + err.message);
        }
    }

    function volunteerLogout() {
        localStorage.removeItem('volunteer_code');
        localStorage.removeItem('volunteer_user_id');
        localStorage.removeItem('volunteer_event_id');
        localStorage.removeItem('volunteer_id');
        window.location.href = 'index.html';
    }

    window.onload = init;
</script>
</body>
</html>
