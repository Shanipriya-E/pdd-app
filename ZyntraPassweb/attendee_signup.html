<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyntraPass - Attendee Signup</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d162a; color: #0d162a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        
        .signup-card {
            background: #ffffff;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 14px;
            color: #475569;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .avatar-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e0e7ff;
            color: #3b35a8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
        }

        .upload-btn-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-upload {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-hint {
            font-size: 12px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #0f172a;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #5b54e3;
        }

        .password-hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 8px;
        }

        .btn-submit {
            width: 100%;
            background: #5b54e3;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            margin-bottom: 24px;
            transition: opacity 0.2s;
        }

        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .footer-text {
            text-align: center;
            font-size: 14px;
            color: #475569;
        }

        .footer-link {
            color: #3b35a8;
            font-weight: 600;
            text-decoration: none;
        }

        .error-msg {
            color: #dc2626;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="signup-card">
    <h1 class="title">Create your attendee account</h1>
    <p class="subtitle">One account works across every organisation and every event, forever.</p>

    <div class="avatar-section">
        <div class="avatar-placeholder" id="avatarPreview">NU</div>
        <div class="upload-btn-container">
            <button type="button" class="btn-upload">📷 Upload profile photo</button>
            <span class="upload-hint">JPG or PNG, up to 4 MB.</span>
        </div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <form id="attendee-signup-form">
        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" id="inp-name" placeholder="Aarav Sharma" required>
        </div>

        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="inp-email" placeholder="you@college.edu" required>
        </div>

        <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-input" id="inp-phone" placeholder="+91 98860 45120" required>
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="inp-password" required minlength="8">
            <div class="password-hint">Use 8+ characters with a number and a symbol.</div>
        </div>

        <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-input" id="inp-confirm-password" required>
        </div>

        <div class="form-group">
            <label class="form-label">Institution / College / Company</label>
            <input type="text" class="form-input" id="inp-inst" placeholder="NIT Surathkal" required>
        </div>

        <div class="form-group">
            <label class="form-label">Area / City</label>
            <input type="text" class="form-input" id="inp-city" placeholder="Mangaluru" required>
        </div>

        <div class="form-group">
            <label class="form-label">Native Place</label>
            <input type="text" class="form-input" id="inp-native" placeholder="Udupi, Karnataka" required>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">Create account</button>

        <p class="footer-text">
            Already have an account? <a href="login.html" class="footer-link">Sign in</a>
        </p>
    </form>
</div>

<script>
    const SUPABASE_URL  = 'https://qokgtrabcxtxlympbkyb.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFva2d0cmFiY3h0eGx5bXBia3liIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczODMyMDYsImV4cCI6MjEwMjk1OTIwNn0.hbs5MZ4FiqUoZxDTrGqtMPOjRbbKUupgZOcoeLZa3ME';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const nameInp = document.getElementById('inp-name');
    const avatar = document.getElementById('avatarPreview');

    // Update avatar placeholder live
    nameInp.addEventListener('input', () => {
        const val = nameInp.value.trim();
        if(val.length > 0) {
            const initials = val.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            avatar.textContent = initials || 'NU';
        } else {
            avatar.textContent = 'NU';
        }
    });

    document.getElementById('attendee-signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btn-submit');
        const err = document.getElementById('error-msg');
        
        const pwd = document.getElementById('inp-password').value;
        const cpwd = document.getElementById('inp-confirm-password').value;

        if (pwd !== cpwd) {
            err.textContent = "Passwords do not match.";
            err.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account...';
        err.style.display = 'none';

        try {
            // 1. Create Auth User
            const { data: authData, error: authError } = await sb.auth.signUp({
                email: document.getElementById('inp-email').value,
                password: pwd
            });

            if (authError) throw authError;

            // 2. Create Profile specific to ATTENDEE in a separate table / structure
            // Since you requested a separate data storage path for this role, we will insert into 'attendee_profiles'
            const user = authData.user;
            if (user) {
                const { error: profileError } = await sb.from('profiles').insert([
                    { 
                        id: user.id,
                        full_name: document.getElementById('inp-name').value,
                        phone: document.getElementById('inp-phone').value,
                        institution: document.getElementById('inp-inst').value,
                        area_city: document.getElementById('inp-city').value,
                        native_place: document.getElementById('inp-native').value
                    }
                ]);

                // If 'attendee_profiles' doesn't exist, we fallback to 'profiles' with role='attendee'
                if (profileError) {
                    console.warn("attendee_profiles insert failed, trying generic profiles table", profileError);
                    const { error: fallbackError } = await sb.from('profiles').insert([
                        { 
                            id: user.id,
                            role: 'attendee',
                            full_name: document.getElementById('inp-name').value,
                            phone_number: document.getElementById('inp-phone').value,
                            institution: document.getElementById('inp-inst').value,
                            area_city: document.getElementById('inp-city').value,
                            native_place: document.getElementById('inp-native').value
                        }
                    ]);
                    if (fallbackError) throw fallbackError;
                }

                alert("Attendee account created successfully! Please log in.");
                window.location.href = 'login.html';
            }
        } catch (error) {
            err.textContent = error.message;
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Create account';
        }
    });

    // Global Sidebar and Menu logic injected by update script
    document.addEventListener("DOMContentLoaded", () => {
        const menuBtn = document.querySelector('.menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        if (menuBtn && sidebar && overlay) {
            menuBtn.addEventListener('click', () => {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            });
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            });
        }
    });
</script>
</body>
</html>
