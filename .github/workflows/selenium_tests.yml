name: Selenium Web Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'selenium/**'
      - 'ZyntraPassweb/**'
      - '.github/workflows/selenium_tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'selenium/**'
      - 'ZyntraPassweb/**'
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r selenium/requirements.txt

      - name: Create reports directory
        run: mkdir -p selenium/reports

      - name: Generate Excel Report
        run: |
          cd selenium
          python generate_report.py

      - name: Run Selenium Tests
        env:
          BASE_URL: ${{ secrets.VERCEL_BASE_URL }}
          ORGANIZER_EMAIL: ${{ secrets.ORGANIZER_EMAIL }}
          ORGANIZER_PASSWORD: ${{ secrets.ORGANIZER_PASSWORD }}
          ORGANIZER_SECRET_KEY: ${{ secrets.ORGANIZER_SECRET_KEY }}
          ATTENDEE_EMAIL: ${{ secrets.ATTENDEE_EMAIL }}
          ATTENDEE_PASSWORD: ${{ secrets.ATTENDEE_PASSWORD }}
          VOLUNTEER_CODE: ${{ secrets.VOLUNTEER_CODE }}
        run: |
          cd selenium
          python -m pytest tests/ -v \
            --tb=short \
            --junitxml=reports/selenium_junit_report.xml \
            --html=reports/selenium_test_report.html \
            --self-contained-html \
            -p no:warnings \
            || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            selenium/reports/selenium_test_report.xlsx
            selenium/reports/selenium_test_report.html
            selenium/reports/selenium_junit_report.xml
          retention-days: 30

      - name: Publish JUnit Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Selenium Test Results
          path: selenium/reports/selenium_junit_report.xml
          reporter: java-junit
          fail-on-error: false

  generate-excel-only:
    runs-on: ubuntu-latest
    needs: selenium-tests
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Generate Final Excel Report
        run: |
          cd selenium
          python generate_report.py

      - name: Upload Final Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-excel-final
          path: selenium/reports/selenium_test_report.xlsx
          retention-days: 90
