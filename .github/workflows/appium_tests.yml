name: Appium Mobile Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'appium/**'
      - 'ZyntraPassFrontend/**'
      - '.github/workflows/appium_tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'appium/**'
      - 'ZyntraPassFrontend/**'
  workflow_dispatch:

jobs:
  appium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      matrix:
        api-level: [30]
        target: [google_apis]
        arch: [x86_64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r appium/requirements.txt

      - name: Install Appium
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot generated"

      - name: Build APK (if Gradle project exists)
        run: |
          if [ -f "ZyntraPassFrontend/gradlew" ]; then
            cd ZyntraPassFrontend
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon || echo "APK build skipped (dependencies missing)"
            cd ..
          fi

      - name: Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Start Appium server in background
            appium --log-level error --relaxed-security &
            APPIUM_PID=$!
            sleep 10

            # Set environment variables
            export APPIUM_HOST=127.0.0.1
            export APPIUM_PORT=4723
            export DEVICE_NAME="emulator-5554"
            export ANDROID_VERSION="${{ matrix.api-level }}"

            # Find APK if built
            APK_PATH=$(find ZyntraPassFrontend -name "*.apk" -path "*/debug/*" 2>/dev/null | head -1)
            if [ -n "$APK_PATH" ]; then
              export APP_PATH="$APK_PATH"
            fi

            # Run tests (continue on failure to capture results)
            cd appium
            python -m pytest tests/ -v \
              --tb=short \
              --junitxml=reports/appium_junit_report.xml \
              --html=reports/appium_test_report.html \
              --self-contained-html \
              || true

            # Generate Excel report
            python generate_report.py

            # Cleanup
            kill $APPIUM_PID 2>/dev/null || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            appium/reports/appium_test_report.xlsx
            appium/reports/appium_test_report.html
            appium/reports/appium_junit_report.xml
          retention-days: 30

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Appium Test Results
          path: appium/reports/appium_junit_report.xml
          reporter: java-junit
          fail-on-error: false

  generate-report:
    runs-on: ubuntu-latest
    needs: appium-tests
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Generate Excel Report
        run: |
          cd appium
          python generate_report.py

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: appium-final-report
          path: appium/reports/appium_test_report.xlsx
          retention-days: 90
